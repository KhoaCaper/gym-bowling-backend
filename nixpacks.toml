# Nixpacks build configuration for Railway
[phases.setup]
nixPkgs = ["jdk17"]

[phases.build]
cmds = [
    "chmod +x ./gradlew",
    "./gradlew clean build -x test --no-daemon"
]

[start]
cmd = "java -Xmx512m -Xms256m -Dspring.profiles.active=railway -jar build/libs/gym-bowling-backend-0.0.1-SNAPSHOT.jar"
