services:
  - type: web
    name: gym-bowling-backend
    env: java
    buildCommand: ./gradlew build -x test
    startCommand: java -jar build/libs/gym-bowling-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: FIREBASE_ENABLED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gym-bowling-db
          property: connectionString
