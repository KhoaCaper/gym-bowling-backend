# Default Application Configuration
# This file will be used if no specific profile is activated

spring.application.name=gym-bowling-backend

# Default profile - will be overridden by environment detection
spring.profiles.active=local

# Basic server configuration
server.port=${PORT:8080}

# Health check endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.drugprevention.gymbowlingbackend=DEBUG
