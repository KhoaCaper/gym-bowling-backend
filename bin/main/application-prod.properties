# Production Configuration
spring.application.name=gym-bowling-backend

# Profile Configuration
spring.profiles.active=prod

# SQL Server Configuration (Production)
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=gym_bowling;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:123123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration (Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server Configuration (Production)
server.port=${PORT:8080}

# Firebase Configuration (Production)
firebase.config.file=${FIREBASE_CONFIG_FILE:firebase-service-account.json}
firebase.enabled=${FIREBASE_ENABLED:true}

# VNPay Configuration (Production)
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://your-domain.com/api/payment/vnpay-return}

# Swagger Configuration (Production)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration (Production)
app.jwt.secret=${JWT_SECRET:production-jwt-secret-key-change-this-in-production}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging for production
logging.level.com.drugprevention.gymbowlingbackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
