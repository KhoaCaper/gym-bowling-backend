# Railway Environment Configuration
spring.application.name=gym-bowling-backend

# Profile Configuration
spring.profiles.active=railway

# PostgreSQL Configuration (Railway)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gym_bowling}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration (Railway) - SAME AS LOCAL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration (Railway)
server.port=${PORT:8080}

# Firebase Configuration (Railway) - DISABLED FOR SIMPLE DEPLOYMENT
firebase.enabled=false

# VNPay Configuration (Railway) - SAME AS LOCAL
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://gym-bowling-backend-production.up.railway.app/api/payment/vnpay-return}

# Swagger Configuration (Railway)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration (Railway) - SAME AS LOCAL
app.jwt.secret=${JWT_SECRET:local-dev-jwt-secret-key-for-development-only-not-for-production-use}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging for Railway - SAME AS LOCAL
logging.level.com.drugprevention.gymbowlingbackend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
