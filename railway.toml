[build]
builder = "GRADLE"

[deploy]
startCommand = "java -jar build/libs/gym-bowling-backend.jar"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.environment]
JAVA_VERSION = "17"
SPRING_PROFILES_ACTIVE = "railway"
FIREBASE_ENABLED = "false"

# Database configuration - Railway will provide these
DATABASE_URL = "jdbc:postgresql://localhost:5432/gym_bowling"
DATABASE_USERNAME = "postgres"
DATABASE_PASSWORD = "password"

# JWT configuration
JWT_SECRET = "local-dev-jwt-secret-key-for-development-only-not-for-production-use"
JWT_EXPIRATION = "86400000"

# VNPay configuration
VNPAY_TMN_CODE = "2QXUI4J4"
VNPAY_HASH_SECRET = "RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN"
VNPAY_PAY_URL = "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
VNPAY_RETURN_URL = "https://gym-bowling-backend-production.up.railway.app/api/payment/vnpay-return"
