# Render Production Configuration
spring.application.name=gym-bowling-backend

# PostgreSQL Configuration (Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:10000}

# Firebase Configuration (disabled on Render)
firebase.config.file=
firebase.enabled=false

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:https://gym-bowling-backend.onrender.com/api/payment/vnpay-return}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-here-make-it-very-long-and-secure-for-production-use}
app.jwt.expiration=86400000

# Logging for production
logging.level.com.drugprevention.gymbowlingbackend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
