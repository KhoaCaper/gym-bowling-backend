# Docker Environment Configuration
spring.application.name=gym-bowling-backend

# SQL Server Configuration (Docker Container)
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=gym_bowling;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server Configuration
server.port=8080

# Firebase Configuration (Docker)
firebase.config.file=firebase-service-account.json
firebase.enabled=true

# VNPay Configuration (Docker)
vnpay.tmnCode=2QXUI4J4
vnpay.hashSecret=RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payment/vnpay-return

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=docker-jwt-secret-key-for-container-environment
app.jwt.expiration=86400000

# Logging for Docker
logging.level.com.drugprevention.gymbowlingbackend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Docker specific settings
spring.main.allow-bean-definition-overriding=true
