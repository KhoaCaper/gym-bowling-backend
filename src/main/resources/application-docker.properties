# Docker Environment Configuration
spring.profiles.active=docker

# Database Configuration
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=gym_bowling;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server Configuration
server.port=8080

# Logging
logging.level.com.drugprevention.gymbowlingbackend=DEBUG
logging.level.org.springframework.security=DEBUG

# Firebase Configuration (will be mounted as volume)
firebase.service-account.path=/app/config/firebase-service-account.json

# VNPay Configuration
vnpay.tmn-code=your_tmn_code
vnpay.hash-secret=your_hash_secret
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay-return
