# Docker Configuration
spring.application.name=gym-bowling-backend

# SQL Server Configuration (Docker)
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=gym_bowling;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server Configuration
server.port=8080

# Firebase Configuration (disabled for Docker)
firebase.config.file=

# VNPay Configuration
vnpay.tmnCode=2QXUI4J4
vnpay.hashSecret=RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payment/vnpay-return

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=your-super-secret-jwt-key-here-make-it-very-long-and-secure-for-production-use
app.jwt.expiration=86400000

# Logging for production
logging.level.root=WARN
logging.level.com.drugprevention.gymbowlingbackend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
