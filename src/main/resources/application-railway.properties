# Railway Production Configuration - ULTRA SIMPLE
spring.application.name=gym-bowling-backend

# DISABLE DATABASE COMPLETELY
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Server Configuration
server.port=${PORT:8080}

# Firebase Configuration - Disabled
firebase.enabled=false

# VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://${RAILWAY_DOMAIN:localhost:8080}/api/payment/vnpay-return}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=${JWT_SECRET:gym-bowling-2024-jwt-secret-key-railway-production-deployment-xyz123-abcdef-789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging - Minimal
logging.level.root=WARN
logging.level.com.drugprevention.gymbowlingbackend=INFO
