# Railway Production Configuration
spring.application.name=gym-bowling-backend

# PostgreSQL Configuration (Railway)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}
server.connection-timeout=120000
server.tomcat.connection-timeout=120000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.startup-timeout=120000

# Firebase Configuration (Railway) - Sử dụng environment variable
firebase.config.file=
firebase.enabled=false

# VNPay Configuration (production) - Giữ nguyên sandbox
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://your-app-name.up.railway.app/api/payment/vnpay-return}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-here-make-it-very-long-and-secure-for-production-use}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging for production
logging.level.com.drugprevention.gymbowlingbackend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
