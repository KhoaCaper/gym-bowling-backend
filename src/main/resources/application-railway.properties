# Railway Production Configuration
spring.application.name=gym-bowling-backend

# PostgreSQL Configuration (Railway)
# Railway provides postgresql:// but JDBC needs jdbc:postgresql://
# Use individual components to avoid URL parsing issues
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - ENABLED WITH PROPER ERROR HANDLING
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# Server Configuration
server.port=${PORT:8080}
server.connection-timeout=120000
server.tomcat.connection-timeout=120000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.startup-timeout=120000

# Firebase Configuration (Railway) - Disabled by default
firebase.config.file=
firebase.enabled=${FIREBASE_ENABLED:false}

# VNPay Configuration (production) - Giữ nguyên sandbox
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://${RAILWAY_DOMAIN}/api/payment/vnpay-return}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-here-make-it-very-long-and-secure-for-production-use}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging for production - Reduced to avoid Railway rate limits
logging.level.com.drugprevention.gymbowlingbackend=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.root=WARN

# Database connection pool settings - ENABLED WITH OPTIMIZED VALUES
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
