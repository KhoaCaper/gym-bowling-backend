spring.application.name=gym-bowling-backend

# PostgreSQL Configuration (Railway auto-provides DATABASE_URL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Railway (auto-update schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Temporary disable database initialization
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Server Configuration
server.port=${PORT:8080}

# Firebase Configuration (will use GOOGLE_APPLICATION_CREDENTIALS_JSON env var if available)
firebase.config.file=${FIREBASE_CONFIG_FILE:}

# VNPay Configuration (Sandbox)
vnpay.tmnCode=${VNPAY_TMN_CODE:2QXUI4J4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:RAOEVONQL21F7OBDXJLXG6Z4GPGIDTYN}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:https://confident-exploration-production.up.railway.app/api/payment/vnpay-return}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.drugprevention.gymbowlingbackend=INFO
