version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: gym_bowling_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=123123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"  # Expose for external access
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database_script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gym_bowling_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 123123 -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Spring Boot Application
  app:
    build: .
    container_name: gym_bowling_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=gym_bowling;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=123123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_SHOW_SQL=true
      - SERVER_PORT=8080
      - FIREBASE_ENABLED=true
      - FIREBASE_CONFIG_FILE=firebase-service-account.json
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json
    networks:
      - gym_bowling_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: gym_bowling_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - gym_bowling_network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  gym_bowling_network:
    driver: bridge
